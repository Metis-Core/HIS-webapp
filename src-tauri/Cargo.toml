[package]
name = "metis-his"
version = "0.1.0"
description = "Metis Healthcare desktop application"
authors = ["Metis Healthcare"]
edition = "2021"

# The library that main.rs (and the mobile entry points) call into.
[lib]
name = "metis_his_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# This feature is used for production builds or when a dev server is not specified,
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
